<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta - Sentinela</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .consulta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .consulta-header h2 {
      margin: 0;
    }

    .btn-voltar {
      width: auto;
      margin-top: 0;
      background: #438fbe;
      padding: 10px 16px;
    }

    .btn-voltar:hover {
      background: #587181;
    }

    .secao {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .secao h3 {
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid > div {
      min-width: 0;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .acoes button {
      margin-top: 0;
    }

    .btn-pdf {
      background: #4fa9df;
      font-weight: bold;
    }

    .btn-pdf:hover {
      background: #3f8dcc;
    }

    .btn-salvar {
      background: #3f98d0;
    }

    .info-paciente {
      background: #eaf6ff;
      border: 1px solid #cfe7f8;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .campo-obrigatorio::after {
      content: ' *';
      color: #e74c3c;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .consulta-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .btn-voltar {
        width: 100%;
      }

      .acoes {
        flex-direction: column;
      }
    }

    @media print {
      body {
        background: #eef9ff;
      }

      .container {
        width: 100%;
        max-width: none;
        margin: 0;
        box-shadow: none;
      }

      .no-print {
        display: none !important;
      }

      input,
      select,
      textarea {
        border: 1px solid #999;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="consulta-header">
    <h2>🩺 Consulta Médica</h2>

    <button
      class="btn-voltar no-print"
      type="button"
      onclick="window.location.href='medico.html'">
      ← Voltar ao Médico
    </button>
  </div>

  <div class="info-paciente">
    <strong>Paciente:</strong>
    <span id="nomePaciente">Nenhum paciente selecionado</span>
  </div>

  <form id="consultaForm">

    <!-- IDENTIFICAÇÃO -->
    <div class="secao">
      <h3>Identificação e avaliação</h3>

      <div class="grid">

        <div>
          <label class="campo-obrigatorio" for="paciente">
            Paciente
          </label>

          <input
            id="paciente"
            required
            placeholder="Nome do paciente">
        </div>

        <div>
          <label for="dataConsulta">
            Data da consulta
          </label>

          <input
            id="dataConsulta"
            type="date">
        </div>

        <div>
          <label for="sintomas">
            Queixa / sintomas
          </label>

          <textarea
            id="sintomas"
            placeholder="Queixa principal e sintomas relatados"></textarea>
        </div>

        <div>
          <label for="alergias">
            Alergias
          </label>

          <textarea
            id="alergias"
            placeholder="Alergias conhecidas ou 'Nenhuma'"></textarea>
        </div>

      </div>
    </div>


    <!-- DADOS CLÍNICOS -->
    <div class="secao">

      <h3>Dados clínicos</h3>

      <div class="grid">

        <div>
          <label for="diagnostico">
            Diagnóstico
          </label>

          <textarea
            id="diagnostico"
            placeholder="Diagnóstico definido pelo médico"></textarea>
        </div>

        <div>
          <label for="tratamento">
            Tratamento / conduta
          </label>

          <textarea
            id="tratamento"
            placeholder="Conduta e orientações realizadas"></textarea>
        </div>

        <div>
          <label for="medicacao">
            Medicação / prescrição
          </label>

          <textarea
            id="medicacao"
            placeholder="Medicamentos, dose e orientações"></textarea>
        </div>

        <div>
          <label for="exames">
            Exames solicitados / resultados
          </label>

          <textarea
            id="exames"
            placeholder="Exames solicitados ou resultados relevantes"></textarea>
        </div>

      </div>
    </div>


    <!-- ALTA -->
    <div class="secao">

      <h3>Alta do paciente</h3>

      <div class="grid">

        <div>
          <label
            class="campo-obrigatorio"
            for="situacaoAlta">
            Situação na alta
          </label>

          <select id="situacaoAlta" required>

            <option value="">
              Selecione
            </option>

            <option>
              Alta médica
            </option>

            <option>
              Alta com acompanhamento
            </option>

            <option>
              Encaminhamento para especialista
            </option>

            <option>
              Encaminhamento para atendimento hospitalar
            </option>

          </select>
        </div>

        <div>
          <label for="retorno">
            Retorno / acompanhamento
          </label>

          <input
            id="retorno"
            placeholder="Ex.: Retorno em 7 dias">
        </div>

        <div>
          <label for="orientacoes">
            Orientações para o paciente
          </label>

          <textarea
            id="orientacoes"
            placeholder="Cuidados, sinais de alerta e orientações para casa"></textarea>
        </div>

        <div>
          <label for="observacoes">
            Observações finais
          </label>

          <textarea
            id="observacoes"
            placeholder="Observações adicionais"></textarea>
        </div>

      </div>
    </div>


    <!-- PROFISSIONAL -->
    <div class="secao">

      <h3>Profissional responsável</h3>

      <div class="grid">

        <div>
          <label for="medico">
            Nome do médico
          </label>

          <input
            id="medico"
            placeholder="Nome do médico">
        </div>

        <div>
          <label for="crm">
            CRM
          </label>

          <input
            id="crm"
            placeholder="CRM do médico">
        </div>

      </div>
    </div>


    <!-- BOTÕES -->
    <div class="acoes no-print">

      <button
        class="btn-salvar"
        type="button"
        onclick="salvarConsulta()">
        Salvar consulta
      </button>

      <button
        class="btn-pdf"
        type="button"
        onclick="gerarPDF()">
        📄 Gerar PDF da alta
      </button>

    </div>

  </form>

</div>


<script>

  const params =
    new URLSearchParams(window.location.search);

  const pacienteParam =
    params.get('paciente');

  const triagemParam =
    params.get('triagem');


  function setValue(id, value) {

    const el =
      document.getElementById(id);

    if (el && value) {
      el.value = value;
    }

  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(
        /[&<>"']/g,
        c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c])
      );

  }


  function carregarPaciente() {

    const paciente =
      pacienteParam ||
      localStorage.getItem('sentinelaPaciente') ||
      '';

    setValue(
      'paciente',
      paciente
    );

    document.getElementById(
      'nomePaciente'
    ).textContent =
      paciente ||
      'Nenhum paciente selecionado';

    document.getElementById(
      'dataConsulta'
    ).value =
      new Date()
        .toISOString()
        .slice(0, 10);


    if (triagemParam) {

      try {

        const t =
          JSON.parse(
            decodeURIComponent(triagemParam)
          );

        setValue(
          'sintomas',
          t.sintoma || ''
        );

        setValue(
          'alergias',
          t.alergia || 'Nenhuma'
        );

      } catch (_) {}

    }

  }


  function dadosFormulario() {

    return {

      paciente:
        document
          .getElementById('paciente')
          .value
          .trim(),

      dataConsulta:
        document
          .getElementById('dataConsulta')
          .value,

      sintomas:
        document
          .getElementById('sintomas')
          .value
          .trim(),

      alergias:
        document
          .getElementById('alergias')
          .value
          .trim(),

      diagnostico:
        document
          .getElementById('diagnostico')
          .value
          .trim(),

      tratamento:
        document
          .getElementById('tratamento')
          .value
          .trim(),

      medicacao:
        document
          .getElementById('medicacao')
          .value
          .trim(),

      exames:
        document
          .getElementById('exames')
          .value
          .trim(),

      situacaoAlta:
        document
          .getElementById('situacaoAlta')
          .value,

      retorno:
        document
          .getElementById('retorno')
          .value
          .trim(),

      orientacoes:
        document
          .getElementById('orientacoes')
          .value
          .trim(),

      observacoes:
        document
          .getElementById('observacoes')
          .value
          .trim(),

      medico:
        document
          .getElementById('medico')
          .value
          .trim(),

      crm:
        document
          .getElementById('crm')
          .value
          .trim()

    };

  }


  async function salvarConsulta(
    silencioso = false
  ) {

    const dados =
      dadosFormulario();


    if (!dados.paciente) {

      alert(
        'Informe ou selecione o paciente.'
      );

      return false;
    }


    if (!dados.situacaoAlta) {

      alert(
        'Selecione a situação na alta.'
      );

      return false;
    }


    try {

      const response =
        await fetch(
          '/consulta',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(dados)
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.erro ||
          'Não foi possível salvar a consulta.'
        );

      }


      if (!silencioso) {

        alert(
          '✅ Consulta salva com sucesso!'
        );

      }


      return true;

    } catch (error) {

      alert(
        error.message
      );

      return false;

    }

  }


  function gerarPDF() {

    const dados =
      dadosFormulario();


    if (!dados.paciente) {

      alert(
        'Informe ou selecione o paciente.'
      );

      return;
    }


    if (!dados.situacaoAlta) {

      alert(
        'Selecione a situação na alta.'
      );

      return;
    }


    const linhas = [

      [
        'SENTINELA - DOCUMENTO DE ALTA DO PACIENTE',
        ''
      ],

      [
        'Paciente',
        dados.paciente
      ],

      [
        'Data da consulta',
        dados.dataConsulta ||
        'Não informada'
      ],

      [
        'Queixa / sintomas',
        dados.sintomas ||
        'Não informado'
      ],

      [
        'Alergias',
        dados.alergias ||
        'Nenhuma informada'
      ],

      [
        'Diagnóstico',
        dados.diagnostico ||
        'Não informado'
      ],

      [
        'Tratamento / conduta',
        dados.tratamento ||
        'Não informado'
      ],

      [
        'Medicação / prescrição',
        dados.medicacao ||
        'Não informado'
      ],

      [
        'Exames',
        dados.exames ||
        'Não informado'
      ],

      [
        'Situação na alta',
        dados.situacaoAlta
      ],

      [
        'Retorno / acompanhamento',
        dados.retorno ||
        'Não informado'
      ],

      [
        'Orientações',
        dados.orientacoes ||
        'Não informado'
      ],

      [
        'Observações finais',
        dados.observacoes ||
        'Nenhuma'
      ],

      [
        'Médico responsável',
        dados.medico ||
        'Não informado'
      ],

      [
        'CRM',
        dados.crm ||
        'Não informado'
      ]

    ];


    const janela =
      window.open(
        '',
        '_blank'
      );


    if (!janela) {

      alert(
        'O navegador bloqueou a janela do PDF. Permita pop-ups para este site.'
      );

      return;
    }


    const camposHTML =
      linhas
        .slice(1)
        .map(
          ([l, v]) => `
            <div class="campo">
              <span class="label">
                ${escapeHtml(l)}:
              </span>
              <br>
              ${escapeHtml(v)
                .replace(/\n/g, '<br>')}
            </div>
          `
        )
        .join('');


    /*
      ASSINATURA DO MÉDICO
      Somente a linha e o texto.
    */

    const assinaturaHTML = `

      <div class="assinatura">

        <div class="linha-assinatura"></div>

        <div class="titulo-assinatura">
          Assinatura do médico
        </div>

      </div>

    `;


    janela.document.write(`

      <!DOCTYPE html>

      <html lang="pt-BR">

      <head>

        <meta charset="UTF-8">

        <title>
          Alta - ${escapeHtml(
            dados.paciente
          )}
        </title>

        <style>

          body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #222;
          }

          h1 {
            text-align: center;
            font-size: 22px;
          }

          h2 {
            font-size: 16px;
            margin-top: 22px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
          }

          .campo {
            margin: 12px 0;
            line-height: 1.5;
          }

          .label {
            font-weight: bold;
          }

          /* ASSINATURA */

          .assinatura {
            margin-top: 55px;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            page-break-inside: avoid;
          }

          .linha-assinatura {
            border-top: 1px solid #222;
            width: 100%;
            margin-bottom: 8px;
          }

          .titulo-assinatura {
            font-size: 13px;
          }

          footer {
            margin-top: 40px;
            text-align: center;
            color: #777;
            font-size: 12px;
          }

        </style>

      </head>

      <body>

        <h1>
          SENTINELA
        </h1>

        <h2>
          Documento de Alta do Paciente
        </h2>

        ${camposHTML}

        ${assinaturaHTML}

        <footer>
          Documento gerado pelo Sistema Sentinela
        </footer>

        <script>

          window.onload = function() {

            setTimeout(
              function() {
                window.print();
              },
              300
            );

          };

        <\/script>

      </body>

      </html>

    `);


    janela.document.close();

  }


  carregarPaciente();

</script>

</body>
</html>
