<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">

<style>
  .btn-tv {
    background: #5aa9e6;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }

  .btn-tv:hover {
    background: #3f8dcc;
  }

  .pacientes-fila {
    margin-bottom: 30px;
    background: #eaf6ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #cfe7f8;
  }

  .pacientes-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pacientes-fila h3 span {
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }

  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #eef9ff;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #d9eefb;
  }

  .fila-item strong {
    font-size: 15px;
  }

  .fila-item small {
    color: #888;
    font-size: 12px;
  }

  .btn-abrir-tv {
    display: inline-block;
    background: #6bb7e8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }

  .btn-abrir-tv:hover {
    background: #3f8dcc;
  }

  .acoes-triagem {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
  }

  .btn-analisar {
    background: #438fbe;
    color: #fff;
    border: 0;
    border-radius: 5px;
    padding: 10px 14px;
    cursor: pointer;
  }

  .btn-analisar:hover {
    background: #3278a4;
  }

  /* RESULTADO DA ANÁLISE */

  #resultado {
    display: none;
    margin: 16px 0;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #cfe0eb;
    background-color: #f5fbff !important;
    color: #263746 !important;
  }

  #resultado.visivel {
    display: block;
  }

  #resultado.verde {
    border-left: 6px solid #299764;
  }

  #resultado.amarelo {
    border-left: 6px solid #e0ad23;
  }

  #resultado.vermelho {
    border-left: 6px solid #d94343;
  }

  /* Impede o CSS geral de deixar a descrição branca */

  #resultado h4,
  #resultado strong,
  #resultado p,
  #resultado li,
  #resultado ul {
    color: #263746 !important;
  }

  #resultado h4 {
    margin: 0 0 12px;
    font-size: 20px;
  }

  #resultado strong {
    display: inline-block;
    margin-top: 12px;
    font-size: 16px;
  }

  #resultado ul {
    margin-top: 6px;
    padding-left: 28px;
  }

  #resultado li {
    margin-bottom: 4px;
  }

  #resultado .aviso-prototipo {
    color: #526575 !important;
    font-size: 12px;
    margin-top: 16px;
  }

  @media (max-width: 600px) {
    .fila-item {
      align-items: flex-start;
      flex-direction: column;
    }

    .btn-tv {
      margin-left: 0;
    }
  }
</style>
</head>

<body>

<div class="container">

  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px;">

    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">
      📺 Abrir Tela da TV
    </button>

  </div>

  <!-- FILA DE PACIENTES -->

  <div class="pacientes-fila">

    <h3>
      Pacientes Cadastrados no Atendimento

      <span>
        Clique em "Chamar na TV" para chamar ao guichê
      </span>
    </h3>

    <div id="fila-pacientes">
      <p style="color:#6d8ea3; text-align:center;">
        Carregando...
      </p>
    </div>

    <button
      onclick="carregarPacientes()"
      style="margin-top:8px; background:#438fbe; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">
      🔄 Atualizar lista
    </button>

  </div>

  <hr>

  <!-- FORMULÁRIO DE TRIAGEM -->

  <h3>Formulário de Triagem</h3>

  <input
    id="nome"
    placeholder="Nome do paciente">

  <select id="sintoma">

    <option value="">Selecione o sintoma</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar moderada</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita de AVC</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>

  </select>

  <input
    id="temp"
    type="number"
    step="0.1"
    min="30"
    max="45"
    placeholder="Temperatura (°C)">

  <input
    id="alergia"
    placeholder="Alergias">

  <textarea
    id="observacao"
    placeholder="Observações"></textarea>

  <div class="acoes-triagem">

    <button
      type="button"
      class="btn-analisar"
      onclick="analisarTriagem()">
      🩺 Analisar sinais e classificar risco
    </button>

    <button
      type="button"
      onclick="salvar()">
      Salvar Triagem
    </button>

  </div>

  <!-- A DESCRIÇÃO SÓ APARECE APÓS CLICAR EM ANALISAR -->

  <section id="resultado" aria-live="polite"></section>

</div>

<script>

let analiseAtual = null;


// CARREGAR FILA DE PACIENTES

function carregarPacientes() {

  fetch("/pacientes")

    .then(response => {

      if (!response.ok) {
        throw new Error("Falha ao carregar pacientes.");
      }

      return response.json();

    })

    .then(pacientes => {

      const div = document.getElementById("fila-pacientes");

      const fila = pacientes.filter(
        paciente => paciente.status === "triagem"
      );

      if (fila.length === 0) {

        div.innerHTML =
          "<p style='color:#6d8ea3;text-align:center;'>Nenhum paciente aguardando.</p>";

        return;

      }

      div.innerHTML = "";

      fila.forEach(paciente => {

        const item = document.createElement("div");
        item.className = "fila-item";

        const info = document.createElement("div");

        const nome = document.createElement("strong");
        nome.textContent = paciente.nome || "Sem nome";

        const detalhes = document.createElement("small");

        detalhes.textContent =
          `CPF: ${paciente.cpf || "—"} | Tipo: ${paciente.tipo || "—"}`;

        info.appendChild(nome);
        info.appendChild(document.createElement("br"));
        info.appendChild(detalhes);

        const botao = document.createElement("button");

        botao.className = "btn-tv";
        botao.textContent = "📺 Chamar na TV";

        botao.addEventListener("click", () => {
          chamarNaTV(paciente.nome);
        });

        item.appendChild(info);
        item.appendChild(botao);

        div.appendChild(item);

      });

    })

    .catch(() => {

      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:red;'>Erro ao carregar pacientes.</p>";

    });

}


// CHAMAR PACIENTE NA TV

async function chamarNaTV(nome) {

  try {

    const response = await fetch("/tv/chamar", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        localTipo: "GUICHÊ",
        localNumero: "01",
        paciente: nome
      })

    });

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro || "Não foi possível chamar."
      );

    }

    alert(
      "✅ " + nome +
      " foi chamado na TV para o Guichê 01!"
    );

  } catch (error) {

    alert(error.message);

  }

}


// ANALISAR OS DADOS DA TRIAGEM

function obterAnalise(
  sintoma,
  temperatura,
  alergia,
  observacao
) {

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  let risco = "verde";

  const motivos = [];
  const causas = [];
  const cuidados = [];
  const acoes = [];


  // CLASSIFICAÇÃO AUTOMÁTICA DO PROTÓTIPO

  if (
    Number.isFinite(temperatura) &&
    temperatura >= 39
  ) {

    risco = "vermelho";

    motivos.push(
      "Temperatura informada igual ou superior a 39 °C."
    );

  } else if (vermelhos.includes(sintoma)) {

    risco = "vermelho";

    motivos.push(
      "O sintoma selecionado pode indicar uma situação de emergência."
    );

  } else if (
    (
      Number.isFinite(temperatura) &&
      temperatura >= 38
    ) ||
    amarelos.includes(sintoma)
  ) {

    risco = "amarelo";

    if (
      Number.isFinite(temperatura) &&
      temperatura >= 38
    ) {

      motivos.push(
        "Temperatura informada igual ou superior a 38 °C."
      );

    }

    if (amarelos.includes(sintoma)) {

      motivos.push(
        "O sintoma selecionado precisa de avaliação da equipe."
      );

    }

  } else {

    motivos.push(
      "Nenhum dos critérios automáticos de maior prioridade deste protótipo foi identificado."
    );

  }


  // POSSÍVEIS CAUSAS

  const mapaCausas = {

    dor_leve: [
      "Dor de diferentes origens; é necessário avaliar local, duração e intensidade."
    ],

    resfriado: [
      "Possível infecção respiratória viral, entre outras causas."
    ],

    coriza: [
      "Pode ocorrer em resfriados, alergias ou irritações."
    ],

    tosse: [
      "Pode ter causas respiratórias diversas, incluindo infecção ou irritação."
    ],

    febre: [
      "Pode estar associada a infecção ou a outras condições."
    ],

    vomito: [
      "Pode ter relação com infecção gastrointestinal, alimentos ou outras causas."
    ],

    diarreia: [
      "Pode ter relação com infecção, alimentação ou outras causas."
    ],

    falta_ar_moderada: [
      "A falta de ar pode ter diferentes causas e precisa ser avaliada."
    ],

    falta_ar_grave: [
      "Falta de ar grave é sinal de alerta e exige atendimento imediato."
    ],

    infarto: [
      "Suspeita de infarto é uma emergência médica."
    ],

    avc: [
      "Suspeita de AVC é uma emergência médica."
    ],

    convulsao: [
      "Convulsão exige avaliação imediata da equipe de saúde."
    ],

    hemorragia: [
      "Hemorragia pode ser uma emergência, dependendo da origem e intensidade."
    ]

  };


  causas.push(
    ...(mapaCausas[sintoma] || [
      "Não há informações suficientes para sugerir possíveis causas. A avaliação deve ser feita por profissional de saúde."
    ])
  );


  // CUIDADOS E AÇÕES SUGERIDAS

  if (risco === "vermelho") {

    cuidados.push(
      "Acione imediatamente a equipe de saúde para avaliação presencial."
    );

    cuidados.push(
      "Não deixe o paciente sozinho enquanto aguarda a equipe."
    );

    acoes.push(
      "Priorizar avaliação imediata por profissional de saúde."
    );

  } else if (risco === "amarelo") {

    cuidados.push(
      "Encaminhar para avaliação da equipe de saúde sem demora desnecessária."
    );

    cuidados.push(
      "Acompanhar a evolução dos sintomas enquanto aguarda."
    );

    acoes.push(
      "Reavaliar sinais e sintomas conforme orientação da equipe."
    );

  } else {

    cuidados.push(
      "Manter o paciente em local seguro e confortável enquanto aguarda avaliação."
    );

    cuidados.push(
      "Orientar que informe à equipe se os sintomas piorarem."
    );

    acoes.push(
      "Seguir o fluxo de atendimento e a avaliação profissional."
    );

  }


  // CONSIDERAR ALERGIAS

  if (alergia) {

    motivos.push(
      "Alergia informada: " + alergia +
      ". A equipe deve considerar essa informação."
    );

    acoes.push(
      "Confirmar a alergia informada antes de qualquer conduta ou medicação."
    );

  }


  // CONSIDERAR OBSERVAÇÕES

  if (observacao) {

    motivos.push(
      "Observação registrada: " + observacao + "."
    );

  }


  return {
    risco,
    motivos,
    causas,
    cuidados,
    acoes
  };

}


// ESCAPAR TEXTO PARA EVITAR INTERPRETAÇÃO COMO HTML

function escaparHTML(valor) {

  return String(valor).replace(/[&<>"']/g, caractere => ({

    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"

  }[caractere]));

}


// EXIBIR A ANÁLISE SOMENTE AO CLICAR NO BOTÃO

function analisarTriagem() {

  const nome =
    document.getElementById("nome").value.trim();

  const sintoma =
    document.getElementById("sintoma").value;

  const tempTexto =
    document.getElementById("temp").value;

  const temperatura =
    tempTexto === "" ? NaN : Number(tempTexto);

  const alergia =
    document.getElementById("alergia").value.trim();

  const observacao =
    document.getElementById("observacao").value.trim();


  if (!nome) {

    alert("Digite o nome do paciente antes de analisar.");

    document.getElementById("nome").focus();

    return;

  }


  if (!sintoma) {

    alert("Selecione o sintoma antes de analisar.");

    document.getElementById("sintoma").focus();

    return;

  }


  analiseAtual = obterAnalise(
    sintoma,
    temperatura,
    alergia,
    observacao
  );


  const resultado =
    document.getElementById("resultado");

  resultado.className =
    "visivel " + analiseAtual.risco;


  const tituloRisco =
    analiseAtual.risco.toUpperCase();


  resultado.innerHTML = `

    <h4>
      Classificação de risco: ${tituloRisco}
    </h4>

    <strong>Motivos considerados</strong>

    <ul>
      ${analiseAtual.motivos
        .map(item => `<li>${escaparHTML(item)}</li>`)
        .join("")}
    </ul>

    <strong>
      Possíveis causas (não são diagnóstico)
    </strong>

    <ul>
      ${analiseAtual.causas
        .map(item => `<li>${escaparHTML(item)}</li>`)
        .join("")}
    </ul>

    <strong>Cuidados imediatos sugeridos</strong>

    <ul>
      ${analiseAtual.cuidados
        .map(item => `<li>${escaparHTML(item)}</li>`)
        .join("")}
    </ul>

    <strong>Ações sugeridas</strong>

    <ul>
      ${analiseAtual.acoes
        .map(item => `<li>${escaparHTML(item)}</li>`)
        .join("")}
    </ul>

    <p class="aviso-prototipo">
      Protótipo educativo: esta classificação automática
      não substitui avaliação profissional, protocolo
      institucional nem atendimento de emergência.
    </p>

  `;

}


// SALVAR TRIAGEM

async function salvar() {

  const nome =
    document.getElementById("nome").value.trim();

  const sintoma =
    document.getElementById("sintoma").value;

  const tempTexto =
    document.getElementById("temp").value;

  const temperatura =
    tempTexto === "" ? null : Number(tempTexto);

  const alergia =
    document.getElementById("alergia").value.trim();

  const observacao =
    document.getElementById("observacao").value.trim();


  if (!nome) {

    alert("Digite o nome do paciente.");

    return;

  }


  if (!sintoma) {

    alert("Selecione o sintoma.");

    return;

  }


  // Calcula para salvar, mas não exibe a descrição automaticamente.

  const analise = analiseAtual || obterAnalise(
    sintoma,
    temperatura === null ? NaN : temperatura,
    alergia,
    observacao
  );


  try {

    const response = await fetch("/triagem", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        nome,
        sintoma,
        temperatura,
        alergia,
        observacao,

        risco: analise.risco,

        fatoresDetectados: analise.motivos,

        causasPossiveis: analise.causas,

        cuidadosImediatos: analise.cuidados,

        acoesSugeridas: analise.acoes

      })

    });


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.erro || "Erro ao salvar triagem."
      );

    }


    alert("Triagem salva com sucesso!");


    document.getElementById("nome").value = "";

    document.getElementById("sintoma").value = "";

    document.getElementById("temp").value = "";

    document.getElementById("alergia").value = "";

    document.getElementById("observacao").value = "";


    // Limpar o resultado depois de salvar.

    document.getElementById("resultado").className = "";

    document.getElementById("resultado").innerHTML = "";

    analiseAtual = null;

    carregarPacientes();


  } catch (error) {

    alert(error.message);

  }

}


// CARREGAR E ATUALIZAR A FILA

carregarPacientes();

setInterval(carregarPacientes, 10000);

</script>

</body>
</html>
